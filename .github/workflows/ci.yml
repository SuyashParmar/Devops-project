name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Install backend dependencies
      working-directory: ./server
      run: npm ci

    - name: Lint Backend
      working-directory: ./server
      run: npm run lint

    - name: Test Backend
      working-directory: ./server
      env:
        JEST_JUNIT_OUTPUT_DIR: reports
        JEST_JUNIT_OUTPUT_NAME: backend-test-results.xml
      run: npx jest --ci --reporters=default --reporters=jest-junit

    - name: Upload Backend Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-report
        path: server/reports/backend-test-results.xml

    - name: Install frontend dependencies
      working-directory: ./client
      run: npm ci

    - name: Lint Frontend
      working-directory: ./client
      run: npm run lint

    - name: Test Frontend
      working-directory: ./client
      run: npm run test -- --run --reporter=junit --outputFile=reports/frontend-test-results.xml

    - name: Upload Frontend Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-report
        path: client/reports/frontend-test-results.xml

    - name: Cypress E2E Tests
      uses: cypress-io/github-action@v6
      with:
        working-directory: ./client
        start: npm run dev
        wait-on: 'http://localhost:5173'
